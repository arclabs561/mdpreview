<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .path }}</title>
    <link rel="stylesheet" href="/static/bundle.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0d1117; }
        }
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        @media (max-width: 767px) {
            .markdown-body { padding: 15px; }
        }
        /* Shiki code blocks already have their own background */
        .markdown-body .shiki { padding: 16px; border-radius: 6px; overflow-x: auto; }
        .status-bar {
            position: fixed;
            bottom: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 11px;
            background: rgba(0,0,0,0.05);
            color: #57606a;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .status-bar:hover { opacity: 1; }
        @media (prefers-color-scheme: dark) {
            .status-bar {
                background: rgba(255,255,255,0.08);
                color: #8b949e;
            }
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2da44e;
        }
        .status-dot.disconnected { background: #cf222e; }
    </style>
</head>
<body>
    <article id="preview" class="markdown-body"></article>
    <div class="status-bar">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Connecting...</span>
    </div>
    <script type="module" src="/static/bundle.js"></script>
</body>
</html>
