<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .path }}</title>
    <link rel="stylesheet" href="/static/bundle.css">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #ffffff;
            --border-color: #d0d7de;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-link: #0969da;
            --sidebar-width: 260px;
            --header-height: 48px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0d1117;
                --bg-secondary: #161b22;
                --bg-tertiary: #0d1117;
                --border-color: #30363d;
                --text-primary: #e6edf3;
                --text-secondary: #8b949e;
                --text-link: #58a6ff;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Noto Sans, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            gap: 12px;
        }
        .header-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .header-toggle:hover { background: var(--border-color); }
        #breadcrumb {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .breadcrumb-link { color: var(--text-link); text-decoration: none; }
        .breadcrumb-link:hover { text-decoration: underline; }
        .breadcrumb-current { color: var(--text-primary); font-weight: 600; }
        .header-spacer { flex: 1; }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2da44e;
        }
        .status-dot.disconnected { background: #cf222e; }

        /* Layout */
        .layout {
            display: flex;
            height: calc(100vh - var(--header-height));
        }

        /* Sidebar */
        #sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            background: var(--bg-secondary);
            overflow-y: auto;
            flex-shrink: 0;
            transition: width 0.2s, opacity 0.2s;
        }
        #sidebar.collapsed { width: 0; overflow: hidden; opacity: 0; }
        #fileTree { padding: 8px 0; }

        .tree-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .tree-item:hover { background: var(--bg-primary); }
        .tree-file.active {
            background: var(--bg-primary);
            font-weight: 600;
        }
        .tree-toggle {
            font-size: 10px;
            width: 12px;
            text-align: center;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .tree-name {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .tree-status {
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 600;
            font-family: monospace;
            margin-left: auto;
            padding-right: 4px;
        }

        /* Content area */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        /* Markdown rendering */
        .markdown-body {
            max-width: 980px;
            margin: 0 auto;
        }
        .katex { color: inherit; }
        .markdown-body .shiki { padding: 16px; border-radius: 6px; overflow-x: auto; }

        /* Code file viewing */
        .code-view {
            max-width: 1200px;
            margin: 0 auto;
        }
        .code-view .shiki {
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
        }
        .code-view pre {
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
            background: var(--bg-secondary);
        }

        .file-error {
            color: var(--text-secondary);
            font-style: italic;
            padding: 32px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="header-toggle" onclick="toggleSidebar()" title="Toggle sidebar">&#9776;</button>
        <div id="breadcrumb"></div>
        <div class="header-spacer"></div>
        <div class="status">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Loading...</span>
        </div>
    </div>
    <div class="layout">
        <div id="sidebar">
            <div id="fileTree"></div>
        </div>
        <div class="content-wrapper">
            <div id="content" class="markdown-body"></div>
        </div>
    </div>
    <script type="module" src="/static/bundle.js"></script>
</body>
</html>
