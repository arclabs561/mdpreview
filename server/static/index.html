<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .path }}</title>
    <link rel="stylesheet" href="/static/bundle.css">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #ffffff;
            --border-color: #d0d7de;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-link: #0969da;
            --sidebar-width: 260px;
            --header-height: 48px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0d1117;
                --bg-secondary: #161b22;
                --bg-tertiary: #0d1117;
                --border-color: #30363d;
                --text-primary: #e6edf3;
                --text-secondary: #8b949e;
                --text-link: #58a6ff;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Noto Sans, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            gap: 12px;
        }
        .header-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .header-toggle:hover { background: var(--border-color); }
        #breadcrumb {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .breadcrumb-link { color: var(--text-link); text-decoration: none; }
        .breadcrumb-link:hover { text-decoration: underline; }
        .breadcrumb-current { color: var(--text-primary); font-weight: 600; }
        .header-spacer { flex: 1; }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2da44e;
        }
        .status-dot.disconnected { background: #cf222e; }
        .last-updated {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Layout */
        .layout {
            display: flex;
            height: calc(100vh - var(--header-height));
        }

        /* Sidebar */
        #sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            background: var(--bg-secondary);
            overflow-y: auto;
            flex-shrink: 0;
            transition: width 0.2s, opacity 0.2s;
        }
        #sidebar.collapsed { width: 0; overflow: hidden; opacity: 0; }
        #fileTree { padding: 8px 0; }

        .tree-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .tree-item:hover { background: var(--bg-primary); }
        .tree-file.active {
            background: var(--text-link);
            color: #ffffff !important;
            font-weight: 600;
            border-radius: 6px;
            margin: 0 4px;
        }
        .tree-file.active .tree-name { color: #ffffff !important; }
        .tree-file.active .tree-status { color: #ffffff !important; opacity: 0.7; }
        .tree-toggle {
            font-size: 10px;
            width: 12px;
            text-align: center;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .tree-name {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .tree-status {
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 600;
            font-family: monospace;
            margin-left: auto;
            padding-right: 4px;
        }

        /* Content area */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        /* Markdown rendering */
        .markdown-body {
            max-width: 980px;
            margin: 0 auto;
        }
        .katex { color: inherit; }
        .markdown-body .shiki { padding: 16px; border-radius: 6px; overflow-x: auto; }
        .markdown-body pre {
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            background: var(--bg-secondary);
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            border: none;
            font-size: 85%;
        }
        .markdown-body code {
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            background: var(--bg-secondary);
            border-radius: 6px;
        }

        /* Code file viewing */
        .code-view {
            max-width: 1200px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        .file-header {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
        }
        .code-body { overflow-x: auto; }
        .code-view .shiki,
        .code-view pre {
            margin: 0;
            padding: 12px 16px;
            border-radius: 0;
            overflow-x: auto;
            font-size: 13px;
            line-height: 20px;
            tab-size: 4;
        }
        .code-view pre { background: var(--bg-secondary); }
        .line-numbers {
            padding-right: 16px;
            text-align: right;
            color: var(--text-secondary);
            opacity: 0.5;
            user-select: none;
            font-size: 13px;
            line-height: 20px;
            flex-shrink: 0;
            white-space: pre;
        }
        .line-numbers span { display: block; }

        .file-error {
            color: var(--text-secondary);
            font-style: italic;
            padding: 32px;
            text-align: center;
        }

        /* TOC */
        .toc-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 12px 12px 4px;
            border-top: 1px solid var(--border-color);
            margin-top: 8px;
        }
        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .toc-list li { padding: 2px 12px; }
        .toc-link {
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .toc-link:hover { color: var(--text-link); }
        .toc-link.toc-active {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Mermaid */
        .mermaid-diagram {
            text-align: center;
            margin: 16px 0;
            overflow-x: auto;
        }

        /* Diff stats badge */
        .diff-stats {
            font-size: 12px;
            font-family: monospace;
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }
        .diff-stats:empty { display: none; }
        .diff-add-count { color: #3fb950; }
        .diff-del-count { color: #f85149; }

        /* Git diff gutter markers */
        .git-gutter-added {
            border-left: 3px solid rgba(63, 185, 80, 0.7);
            padding-left: 4px;
        }
        .git-gutter-changed {
            border-left: 3px solid rgba(210, 153, 34, 0.7);
            padding-left: 4px;
        }

        /* Git line-level gutter (code view) */
        .git-line-added { background: rgba(63, 185, 80, 0.1); }
        .git-line-changed { background: rgba(210, 153, 34, 0.1); }
        .git-line-deleted-before {
            border-top: 2px solid rgba(248, 81, 73, 0.4);
        }
        /* Deleted line marker (markdown view) */
        .git-gutter-deleted {
            border-left: 3px solid rgba(248, 81, 73, 0.7);
            padding-left: 4px;
        }

        /* Diff highlights */
        @keyframes diff-fade {
            0%   { background-color: var(--diff-color); }
            100% { background-color: transparent; }
        }
        .diff-changed {
            --diff-color: rgba(210, 153, 34, 0.15);
            animation: diff-fade 2s ease-out forwards;
            border-radius: 3px;
        }
        .diff-added {
            --diff-color: rgba(63, 185, 80, 0.15);
            animation: diff-fade 2s ease-out forwards;
            border-radius: 3px;
        }
        @media (prefers-color-scheme: dark) {
            .diff-changed { --diff-color: rgba(210, 153, 34, 0.12); }
            .diff-added { --diff-color: rgba(63, 185, 80, 0.12); }
        }

        /* Change map (minimap strip) */
        #changeMap {
            position: absolute;
            top: 0;
            right: 0;
            width: 6px;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .change-marker {
            position: absolute;
            right: 0;
            width: 6px;
            min-height: 3px;
            background: rgba(210, 153, 34, 0.6);
            border-radius: 1px;
            pointer-events: auto;
            cursor: pointer;
            transition: background 0.15s;
        }
        .change-marker:hover { background: rgba(210, 153, 34, 0.9); }
        .change-marker-added { background: rgba(63, 185, 80, 0.6); }
        .change-marker-added:hover { background: rgba(63, 185, 80, 0.9); }
        .change-marker-git { background: rgba(63, 185, 80, 0.4); opacity: 0.8; }
        .change-marker-git.change-marker-git-changed { background: rgba(210, 153, 34, 0.4); }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }
        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="header-toggle" onclick="toggleSidebar()" title="Toggle sidebar">&#9776;</button>
        <div id="breadcrumb"></div>
        <div class="header-spacer"></div>
        <span id="diffStats" class="diff-stats"></span>
        <span id="lastUpdated" class="last-updated"></span>
        <div class="status">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Loading...</span>
        </div>
    </div>
    <div class="layout">
        <div id="sidebar">
            <div id="fileTree"></div>
            <div id="toc"></div>
        </div>
        <div class="content-wrapper">
            <div id="content" class="markdown-body"></div>
        </div>
    </div>
    <script>window.__repoName = "{{ .repoName }}";</script>
    <script type="module" src="/static/bundle.js"></script>
</body>
</html>
