<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .path }}</title>
    <link rel="stylesheet" href="/static/bundle.css">
    <style>
        :root {
            /* Primer light theme tokens */
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #f6f8fa;
            --border-color: #d1d9e0;
            --text-primary: #1f2328;
            --text-secondary: #59636e;
            --text-link: #0969da;
            --success-fg: #1a7f37;
            --danger-fg: #d1242f;
            --attention-fg: #9a6700;
            --sidebar-width: 220px;
            --header-height: 48px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                /* Primer dark theme tokens */
                --bg-primary: #0d1117;
                --bg-secondary: #151b23;
                --bg-tertiary: #010409;
                --border-color: #3d444d;
                --text-primary: #f0f6fc;
                --text-secondary: #9198a1;
                --text-link: #4493f8;
                --success-fg: #3fb950;
                --danger-fg: #f85149;
                --attention-fg: #d29922;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Noto Sans, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            gap: 12px;
        }
        .header-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .header-toggle:hover { background: var(--border-color); }
        #breadcrumb {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .breadcrumb-link { color: var(--text-link); text-decoration: none; }
        .breadcrumb-link:hover { text-decoration: underline; }
        .breadcrumb-current { color: var(--text-primary); font-weight: 600; }
        .header-spacer { flex: 1; }
        .editor-actions { display: flex; align-items: center; gap: 6px; }
        .editor-button {
            border: 1px solid var(--border-color); background: var(--bg-primary);
            color: var(--text-primary); border-radius: 5px; padding: 4px 9px;
            cursor: pointer; font-size: 12px;
        }
        .editor-button:hover { border-color: var(--text-link); }
        .editor-button:focus-visible, .header-toggle:focus-visible, .tree-item:focus-visible {
            outline: 2px solid var(--text-link); outline-offset: 2px;
        }
        .editor-button[disabled] { opacity: .55; cursor: default; }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success-fg);
        }
        .status-dot.disconnected { background: var(--danger-fg); }
        .last-updated {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Layout */
        .layout {
            display: flex;
            height: calc(100vh - var(--header-height));
        }

        /* Sidebar */
        #sidebar {
            width: var(--sidebar-width);
            min-width: 140px;
            max-width: 500px;
            border-right: 1px solid var(--border-color);
            background: var(--bg-secondary);
            overflow-y: auto;
            flex-shrink: 0;
            transition: opacity 0.2s;
            position: relative;
        }
        #sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; opacity: 0; }
        #fileTree { padding: 8px 0; }

        /* Sidebar resize handle */
        .sidebar-resize {
            position: absolute;
            top: 0;
            right: -3px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            z-index: 20;
        }
        .sidebar-resize:hover,
        .sidebar-resize.dragging {
            background: var(--text-link);
            opacity: 0.3;
        }

        .tree-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .tree-item:hover {
            background: var(--bg-primary);
            border-radius: 6px;
            margin: 0 4px;
            transition: background 0.1s;
        }
        .tree-file.active {
            background: var(--bg-primary);
            color: var(--text-primary) !important;
            font-weight: 600;
            border-radius: 6px;
            margin: 0 4px;
            border-left: 2px solid var(--text-link);
        }
        .tree-file.active .tree-name { color: var(--text-primary) !important; }
        .tree-file.active .tree-status { opacity: 0.7; }
        .tree-toggle {
            font-size: 10px;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            flex-shrink: 0;
            border-radius: 3px;
            transition: background 0.1s;
        }
        .tree-dir:hover .tree-toggle { background: var(--border-color); }
        .tree-name {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .tree-status {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin-left: auto;
            padding-right: 4px;
            opacity: 0.8;
        }

        /* Content area */
        .content-wrapper {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            position: relative;
        }
        #previewPane { height: 100%; overflow-y: auto; padding: 32px 40px; }
        #editorPane { display: none; min-width: 0; height: 100%; background: var(--bg-tertiary); border-right: 1px solid var(--border-color); }
        .content-wrapper.editing { display: grid; grid-template-columns: minmax(18rem, 1fr) minmax(0, 1fr); }
        .content-wrapper.editing #editorPane { display: flex; flex-direction: column; }
        .content-wrapper.editing #previewPane { padding: 32px 40px; }
        .editor-meta { min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--text-secondary); font-size: 12px; border-bottom: 1px solid var(--border-color); }
        .editor-conflict-actions { display: inline-flex; gap: 6px; margin-left: auto; }
        #editor { flex: 1; min-height: 0; width: 100%; resize: none; border: 0; padding: 16px; outline: none; background: transparent; color: var(--text-primary); font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; }
        @media (max-width: 50rem) { .content-wrapper.editing { grid-template-columns: 1fr; } .content-wrapper.editing #previewPane { display: none; } }
        }

        /* Markdown rendering */
        .markdown-body {
            max-width: 980px;
            margin: 0 auto;
        }
        .katex { color: inherit; }
        .markdown-body .shiki { padding: 16px; border-radius: 6px; overflow-x: auto; }
        .markdown-body pre {
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            background: var(--bg-secondary);
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            border: none;
            font-size: 85%;
        }
        .markdown-body code {
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            background: var(--bg-secondary);
            border-radius: 6px;
        }

        /* Code file viewing */
        .code-view {
            max-width: 1200px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        .file-header {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
        }
        .code-body { overflow-x: auto; }
        .code-view .shiki,
        .code-view pre {
            margin: 0;
            padding: 12px 16px;
            border-radius: 0;
            overflow-x: auto;
            font-size: 13px;
            line-height: 20px;
            tab-size: 4;
        }
        .code-view pre { background: var(--bg-secondary); }
        .line-numbers {
            padding-right: 16px;
            text-align: right;
            color: var(--text-secondary);
            opacity: 0.5;
            user-select: none;
            font-size: 13px;
            line-height: 20px;
            flex-shrink: 0;
            white-space: pre;
        }
        .line-numbers span { display: block; }

        .file-error {
            color: var(--text-secondary);
            font-style: italic;
            padding: 32px;
            text-align: center;
        }

        /* TOC */
        #toc:empty { display: none; }
        .toc-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            padding: 16px 12px 6px;
            border-top: 1px solid var(--border-color);
            margin-top: 8px;
        }
        .toc-list {
            list-style: none;
            padding: 0 0 8px;
            margin: 0;
        }
        .toc-list li {
            padding: 1px 12px;
        }
        .toc-link {
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 2px 6px;
            border-radius: 4px;
            border-left: 2px solid transparent;
            transition: color 0.1s, border-color 0.1s;
        }
        .toc-link:hover {
            color: var(--text-primary);
        }
        .toc-link.toc-active {
            color: var(--text-primary);
            font-weight: 500;
            border-left-color: var(--text-link);
        }

        /* Wide screen: move TOC to right side */
        @media (min-width: 1400px) {
            .layout { position: relative; }
            #toc {
                position: fixed;
                right: 16px;
                top: calc(var(--header-height) + 16px);
                width: 200px;
                max-height: calc(100vh - var(--header-height) - 32px);
                overflow-y: auto;
            }
            #toc .toc-title {
                border-top: none;
                margin-top: 0;
                padding-top: 0;
            }
        }

        /* Mermaid */
        .mermaid-diagram {
            text-align: center;
            margin: 16px 0;
            overflow-x: auto;
        }

        /* Diff stats badge */
        .diff-stats {
            font-size: 12px;
            font-family: monospace;
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }
        .diff-stats:empty { display: none; }
        .diff-add-count { color: var(--success-fg); }
        .diff-del-count { color: var(--danger-fg); }

        /* Git diff gutter markers */
        .git-gutter-added {
            border-left: 3px solid rgba(63, 185, 80, 0.7);
            padding-left: 4px;
        }
        .git-gutter-changed {
            border-left: 3px solid rgba(210, 153, 34, 0.7);
            padding-left: 4px;
        }

        /* Git line-level gutter (code view) */
        .git-line-added { background: rgba(63, 185, 80, 0.1); }
        .git-line-changed { background: rgba(210, 153, 34, 0.1); }
        .git-line-deleted-before {
            border-top: 2px solid rgba(248, 81, 73, 0.4);
        }
        /* Deleted line marker (markdown view) */
        .git-gutter-deleted {
            border-left: 3px solid rgba(248, 81, 73, 0.7);
            padding-left: 4px;
        }

        /* Diff highlights */
        @keyframes diff-fade {
            0%   { background-color: var(--diff-color); }
            100% { background-color: transparent; }
        }
        .diff-changed {
            --diff-color: rgba(210, 153, 34, 0.15);
            animation: diff-fade 2s ease-out forwards;
            border-radius: 3px;
        }
        .diff-added {
            --diff-color: rgba(63, 185, 80, 0.15);
            animation: diff-fade 2s ease-out forwards;
            border-radius: 3px;
        }
        @media (prefers-color-scheme: dark) {
            .diff-changed { --diff-color: rgba(210, 153, 34, 0.12); }
            .diff-added { --diff-color: rgba(63, 185, 80, 0.12); }
        }

        /* Change map (minimap strip) */
        #changeMap {
            position: absolute;
            top: 0;
            right: 0;
            width: 6px;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .change-marker {
            position: absolute;
            right: 0;
            width: 6px;
            min-height: 3px;
            background: rgba(210, 153, 34, 0.6);
            border-radius: 1px;
            pointer-events: auto;
            cursor: pointer;
            transition: background 0.15s;
        }
        .change-marker:hover { background: rgba(210, 153, 34, 0.9); }
        .change-marker-added { background: rgba(63, 185, 80, 0.6); }
        .change-marker-added:hover { background: rgba(63, 185, 80, 0.9); }
        .change-marker-git { background: rgba(63, 185, 80, 0.4); opacity: 0.8; }
        .change-marker-git.change-marker-git-changed { background: rgba(210, 153, 34, 0.4); }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }
        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="header-toggle" onclick="toggleSidebar()" title="Toggle sidebar">&#9776;</button>
        <div id="breadcrumb"></div>
        <div class="header-spacer"></div>
        <div class="editor-actions">
            <button id="editToggle" class="editor-button" type="button" disabled>Edit</button>
            <button id="saveButton" class="editor-button" type="button" hidden>Save</button>
        </div>
        <span id="diffStats" class="diff-stats"></span>
        <span id="lastUpdated" class="last-updated"></span>
        <div class="status">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Loading...</span>
        </div>
    </div>
    <div class="layout">
        <div id="sidebar">
            <div id="fileTree"></div>
            <div id="toc"></div>
            <div class="sidebar-resize" id="sidebarResize"></div>
        </div>
        <div class="content-wrapper">
            <section id="editorPane" aria-label="Markdown editor">
                <div id="editorMeta" class="editor-meta">
                    <span id="editorStatus">Loading source…</span>
                    <span id="editorConflictActions" class="editor-conflict-actions" hidden>
                        <button id="reloadDiskButton" class="editor-button" type="button">Reload disk version</button>
                        <button id="keepDraftButton" class="editor-button" type="button">Keep draft</button>
                    </span>
                </div>
                <textarea id="editor" spellcheck="false" aria-label="Markdown source"></textarea>
            </section>
            <div id="previewPane"><div id="content" class="markdown-body"></div></div>
        </div>
    </div>
    <script>window.__repoName = "{{ .repoName }}";</script>
    <script type="module" src="/static/bundle.js"></script>
</body>
</html>
