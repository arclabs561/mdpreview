# Managed by repository-settings/app
# https://github.com/repository-settings/app

repository:
  description: "Git-aware markdown preview with live reload, diff viewing, and export"
  private: false
  has_issues: true
  has_wiki: false
  has_downloads: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true

  topics:
    - markdown
    - markdown-preview
    - live-reload
    - golang
    - websocket
